name: release

# Tag-triggered builds run only in the public mirror, on hosted runners.
# Every job is guarded so this snapshot workflow is a no-op elsewhere.
# Release assets can be traced back to the tagged source and build logs.
# Actions are pinned by commit SHA.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (build and package only; never publish)
        required: true
        type: choice
        options: ['2.9.1']
        default: '2.9.1'

# Jobs that execute repository code never hold release-writing authority.
permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'noisefloor-oss/tasks' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # No checkout; existing releases, including drafts and notes, survive.
      - name: Ensure the release for the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "noise-tasks $GITHUB_REF_NAME — installation archives and SHA256SUMS attached by the release workflow."

  build:
    if: always() && github.repository == 'noisefloor-oss/tasks' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      CGO_ENABLED: '0'
      # Root-owned packaging must not depend on the builder's Git trust config.
      GOFLAGS: -trimpath -buildvcs=false
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Validate version and native architecture
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$CANDIDATE_VERSION" = 2.9.1
            version="$CANDIDATE_VERSION"
          else
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || exit 1
            version="${GITHUB_REF_NAME#v}"
          fi
          # The value reaches make's ldflags and root-owned packaging.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || exit 1
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          case "$GOARCH" in
            amd64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
      - name: Build
        run: make build VERSION="$RELEASE_VERSION"
      - name: Smoke-run version and help outside the checkout
        run: |
          bin="$GITHUB_WORKSPACE/build/bin/noise-tasks"
          smoke=$(mktemp -d)
          trap 'rmdir "$smoke"' EXIT
          cd "$smoke"
          expected="noise-tasks $RELEASE_VERSION"
          actual=$("$bin" version)
          if [ "$actual" != "$expected" ]; then
            echo "version smoke failed: got '$actual', want '$expected'" >&2
            exit 1
          fi
          "$bin" --help
      - name: Package the installation tree
        # The broker requires root ownership and mode 6755; preserve both
        # inside a tarball rather than uploading the installation tree.
        run: |
          staging=$(sudo mktemp -d /tmp/noise-package.XXXXXX)
          trap 'sudo rm -rf "$staging"' EXIT
          sudo env PATH="$PATH" CGO_ENABLED="$CGO_ENABLED" GOFLAGS="$GOFLAGS" \
            GOOS="$GOOS" GOARCH="$GOARCH" \
            make package GO="$(command -v go)" VERSION="$RELEASE_VERSION" \
            DESTDIR="$staging"
          sudo cmp build/bin/noise-tasks "$staging/usr/local/bin/noise-tasks"
          sudo tar -C "$staging" -czf - usr > "noise-tasks-linux-$GOARCH.tar.gz"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noise-tasks-linux-${{ matrix.arch }}
          path: noise-tasks-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.repository == 'noisefloor-oss/tasks' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # No checkout or execution of downloaded assets under write authority.
      # The complete matrix must succeed before any assets are attached.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: noise-tasks-linux-*
          merge-multiple: true
      - name: Attach installation archives and SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum noise-tasks-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" \
            noise-tasks-linux-*.tar.gz SHA256SUMS --clobber
